[workspace]
members = [
    "apps/cli",
    "crates/core",
    "crates/jobs",
    "crates/ooxml",
    "crates/storage",
    "shared/types",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.95"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0.133"
thiserror = "2.0.9"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.11.0", features = ["v4"] }
zip = "2.4.2"
