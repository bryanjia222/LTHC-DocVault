[package]
name = "docvault-desktop"
version = "0.3.1"
description = "DocVault desktop application"
authors = ["DocVault Contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# Focus the existing window when a second instance is launched instead of
# opening a duplicate.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
tracing = "0.1"
# Initialize a tracing subscriber so the crates' `tracing::info!/warn!` calls
# actually land somewhere (without a subscriber they are discarded). The reload
# handle lets `set_log_level` switch the active level at runtime without a
# restart; `tracing-appender` rolls a daily log file under the app config dir.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Launch the OS default editor (Word/WPS) on a library working copy. Pure Rust
# call from a command, so no Tauri plugin / capability is needed.
open = "5"
# Fetch page titles/favicons for the sidebar quick-links add flow. rustls-tls so
# HTTPS works with bundled webpki roots (no OS cert store / OpenSSL dependency);
# system-proxy so HTTP(S)_PROXY env vars are honored (like the restic fetch);
# gzip/deflate/brotli so compressed bodies (the default for most sites over
# https) are decompressed - otherwise the <title> scan sees raw gzip bytes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "gzip", "deflate", "brotli", "json"] }
# Qinbixin's test host emits a very large Set-Cookie header block. reqwest does
# not expose Hyper's HTTP/1 buffer limit, so this API uses a tuned legacy
# Hyper client directly.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http-body = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "logging", "ring", "tls12", "webpki-roots"] }
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["time"] }
base64 = "0.22"
encoding_rs = "0.8"
# In-process loopback HTTP server for the Office/WPS add-in bridge. Plain HTTP
# on 127.0.0.1 only; no TLS feature needed (the add-in task pane is same-origin
# with this server and the API carries a per-session token).
tiny_http = "0.12"
# Percent-decode the add-in's fileName / ext / note query params (file names can
# be CJK, so raw UTF-8 percent-encoding must be decoded on the bridge).
percent-encoding = "2"
# Scratch dir for preview_version's export-then-read-bytes dance (auto-cleaned).
tempfile = "3"
docvault-core = { path = "../../../crates/core" }
docvault-storage = { path = "../../../crates/storage" }
docvault-types = { path = "../../../shared/types" }
docvault-jobs = { path = "../../../crates/jobs" }
docvault-ooxml = { path = "../../../crates/ooxml" }

# Keep this crate out of the root workspace; it is built standalone by tauri.
[workspace]

[dev-dependencies]
tempfile = "3"
