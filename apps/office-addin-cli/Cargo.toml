[package]
name = "docvault-office-addin-cli"
version = "0.1.0"
description = "Install/uninstall the DocVault Office add-in via the shared-folder-catalog registry mechanism"
edition = "2021"
license = "MIT"

# Windows-only admin tool; built standalone (opt out of the root workspace,
# like apps/desktop/src-tauri).
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
winreg = "0.52"

[[bin]]
name = "docvault-addin"
path = "src/main.rs"
